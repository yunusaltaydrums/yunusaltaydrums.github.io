<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minik Davulcu</title>
<meta name="theme-color" content="#7c3aed">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Minik Davulcu">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap">
<style>
/* Layout: full-screen kid app. Screens: map (levels path) · play (giant box grid + big buttons) · pad (tap a drum kit) · echo (copy game). Bottom bar with 3 huge tabs. */
:root{--bg:#fff7ed;--ink:#2e1065;--muted:#7c6f99;--card:#ffffff;--line:#f3e8ff;
 --bum:#ef4444;--tak:#2563eb;--ts:#eab308;--cak:#a855f7;--go:#22c55e;--star:#f59e0b;--brand:#7c3aed;
 --f:"Baloo 2","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#fff7ed;color-scheme:light}}
:root[data-theme="dark"]{--bg:#fff7ed;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);height:100%;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-size:20px}
button{font-family:inherit;color:inherit;cursor:pointer;border:0}
.app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px 6px}
.top h1{margin:0;font-size:28px;line-height:1;flex:1;color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{background:#fff;border-radius:999px;padding:6px 14px;font-size:22px;font-weight:800;box-shadow:0 3px 0 #fde68a}
.back{width:52px;height:52px;border-radius:18px;background:#fff;font-size:28px;box-shadow:0 4px 0 #e9d5ff}
main{overflow-y:auto;overflow-x:hidden;padding:6px 16px 16px;-webkit-overflow-scrolling:touch}
nav.bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));background:#fff;box-shadow:0 -4px 0 #f3e8ff}
nav.bar button{border-radius:20px;background:var(--bg);padding:6px 4px 4px;font-size:17px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:0;min-height:66px}
nav.bar button span{font-size:30px;line-height:1.1}
nav.bar button[aria-current="page"]{background:var(--brand);color:#fff;box-shadow:0 4px 0 #5b21b6}
/* map */
.hello{font-size:24px;margin:6px 2px 12px;font-weight:700}
.path{display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto}
.lvl{display:flex;align-items:center;gap:14px;background:#fff;border-radius:26px;padding:12px 16px;text-align:left;box-shadow:0 6px 0 #ede9fe;min-height:92px;width:100%}
.lvl:nth-child(even){margin-left:28px;width:calc(100% - 28px)}
.lvl .em{flex:none;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font-size:40px;background:#fef3c7}
.lvl b{display:block;font-size:24px;line-height:1.1}
.lvl small{font-size:17px;color:var(--muted);font-weight:600}
.lvl .ls{margin-left:auto;font-size:24px;letter-spacing:-2px;white-space:nowrap}
.lvl.locked{opacity:.6}
.lvl.locked .em{background:#e5e7eb;filter:grayscale(1)}
.cert-btn{display:block;margin:18px auto 4px;background:var(--star);color:#fff;font-size:24px;font-weight:800;padding:14px 22px;border-radius:24px;box-shadow:0 6px 0 #b45309}
/* play */
.ptitle{font-size:34px;font-weight:800;margin:4px 0 0;line-height:1.05}
.pnote{font-size:20px;color:var(--muted);margin:2px 0 10px;font-weight:600}
.grid{background:#fff;border-radius:26px;padding:12px;box-shadow:0 6px 0 #ede9fe;display:grid;gap:6px;position:relative}
.grid .row{display:grid;grid-template-columns:76px repeat(8,1fr);gap:6px;align-items:center}
.grid .lab{font-size:20px;font-weight:800;text-align:left;line-height:1}
.grid .lab small{display:block;font-size:13px;color:var(--muted);font-weight:700}
.grid .c{aspect-ratio:1;border-radius:14px;background:#f5f3ff;display:grid;place-items:center;font-size:clamp(11px,3.2vw,22px);font-weight:800;color:#fff;transition:transform .08s}
.grid .c.f{box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.grid .cnt .c{background:none;color:var(--ink);font-size:clamp(16px,4.6vw,28px);aspect-ratio:auto}
.grid .cnt .c.big{color:var(--brand)}
.grid .col-on{transform:scale(1.13)}
.grid .cnt .c.col-on{color:var(--bum)}
.c.bd{background:var(--bum)}.c.sd{background:var(--tak)}.c.hh{background:var(--ts);color:#422006}.c.cl{background:var(--cak)}
.say{display:flex;justify-content:center;align-items:center;min-height:86px;font-size:clamp(46px,14vw,90px);font-weight:800;line-height:1;margin:6px 0;color:var(--brand)}
.say.pop{animation:pop .18s}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.ctrl{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px;align-items:stretch;margin-top:6px}
.bigbtn{border-radius:24px;font-size:26px;font-weight:800;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.bigbtn small{font-size:15px;font-weight:700;margin-top:2px}
.play{background:var(--go);color:#fff;box-shadow:0 7px 0 #15803d;font-size:34px}
.play.on{background:var(--bum);box-shadow:0 7px 0 #b91c1c}
.slow{background:#fff;box-shadow:0 6px 0 #ddd6fe}
.fast{background:#fff;box-shadow:0 6px 0 #ddd6fe}
.meter{margin-top:14px;background:#fff;border-radius:22px;padding:10px 14px;box-shadow:0 5px 0 #ede9fe}
.meter .t{display:flex;justify-content:space-between;font-weight:800;font-size:19px}
.meter .bar{height:20px;border-radius:99px;background:#f3e8ff;overflow:hidden;margin-top:6px}
.meter .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f59e0b,#ef4444);transition:width .4s linear}
.tip{font-size:18px;color:var(--muted);font-weight:700;margin:10px 2px 0;text-align:center}
/* pad */
.kit{position:relative;max-width:640px;margin:0 auto;aspect-ratio:1/1}
.kit svg{width:100%;height:100%;display:block;touch-action:none}
.kit .dr{cursor:pointer}
.kit .dr.hit{transform-box:fill-box;transform-origin:center;animation:hit .15s}
@keyframes hit{50%{transform:scale(.9)}}
.padhint{text-align:center;font-weight:700;color:var(--muted);font-size:19px;margin:0 0 6px}
/* echo */
.echo{max-width:560px;margin:0 auto;text-align:center}
.echo .seq{display:flex;justify-content:center;gap:10px;margin:14px 0;min-height:76px}
.echo .dot{width:64px;height:64px;border-radius:50%;background:#f3e8ff;display:grid;place-items:center;font-size:18px;font-weight:800;color:#fff}
.echo .dot.lit{transform:scale(1.15)}
.echo .pads{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.echo .pad{border-radius:30px;min-height:150px;font-size:40px;font-weight:800;color:#fff;box-shadow:0 9px 0 rgba(0,0,0,.2)}
.echo .pad:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.2)}
.echo .msg{font-size:26px;font-weight:800;min-height:40px;margin:6px 0}
.echo .go{background:var(--brand);color:#fff;font-size:26px;font-weight:800;border-radius:22px;padding:14px 26px;box-shadow:0 6px 0 #5b21b6}
/* overlays */
.ov{position:fixed;inset:0;z-index:30;background:rgba(46,16,101,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#fff;border-radius:30px;padding:22px;max-width:440px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px}
.box h2{margin:0;font-size:32px;color:var(--brand);line-height:1.05}
.box p{margin:0;font-size:19px;font-weight:600}
.box input{font:700 20px var(--f);border:3px solid #ddd6fe;border-radius:18px;padding:12px 14px;text-align:center;-webkit-user-select:text;user-select:text;color:var(--ink)}
.box .b1{background:var(--brand);color:#fff;font-size:24px;font-weight:800;border-radius:20px;padding:14px;box-shadow:0 6px 0 #5b21b6}
.box .b2{background:#f5f3ff;font-size:19px;font-weight:800;border-radius:18px;padding:12px}
.err{color:var(--bum);font-weight:800;font-size:17px;min-height:1em}
.big-star{font-size:90px;line-height:1;animation:pop .4s}
.cert{border:8px solid var(--star);border-radius:30px;background:#fffbeb;padding:24px 18px;text-align:center}
.cert h2{font-size:34px}
.cert .nm{font-size:40px;font-weight:800;color:var(--bum);line-height:1.1;margin:8px 0}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall 1.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.wm{position:fixed;right:10px;bottom:calc(92px + env(safe-area-inset-bottom,0px));font-size:12px;color:#c4b5fd;font-weight:700;pointer-events:none}
@media (min-width:900px){.grid .row{grid-template-columns:110px repeat(8,1fr)}.grid .c{font-size:24px}}
@media (orientation:landscape) and (max-height:520px){.ptitle{font-size:26px}.pnote{display:none}.say{min-height:50px;font-size:54px;margin:0}.bigbtn{min-height:62px}.grid .c{aspect-ratio:auto;height:34px}.top{padding-top:4px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
nav.bar button{font-size:15px}
.c.cr{background:#f97316}.c.t1{background:#16a34a}
.mk .c{cursor:pointer;border:0;font-family:inherit}
.mk .c:active{transform:scale(.92)}
.mk button.c:not(.f){color:transparent}
.mk button.c{padding:0;width:100%;min-width:0;aspect-ratio:1;font-size:clamp(10px,2.7vw,18px)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.acts button{background:#fff;border-radius:22px;min-height:70px;font-size:19px;font-weight:800;box-shadow:0 6px 0 #ddd6fe;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.acts button span{font-size:28px}
.acts button.on{background:var(--brand);color:#fff;box-shadow:0 6px 0 #5b21b6}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.slot{background:#fff;border-radius:22px;min-height:84px;font-size:17px;font-weight:800;box-shadow:0 6px 0 #ede9fe;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1}
.slot span{font-size:32px}
.slot.empty{color:var(--muted);opacity:.75}
.slots.saving .slot{outline:4px dashed var(--brand);outline-offset:-4px}
.realn{margin-top:14px;background:#fff;border-radius:22px;padding:10px 12px;box-shadow:0 5px 0 #ede9fe}
.realn b{font-size:18px}
.realn small{display:block;font-size:15px;color:var(--muted);font-weight:700}
.realn svg{display:block;width:100%;height:auto;margin-top:4px}
.sec{font-size:22px;font-weight:800;margin:18px 2px 0}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <button class="back" id="back" aria-label="Geri" hidden>‹</button>
    <h1 id="title">Minik Davulcu</h1>
    <div class="stars" id="starCount" aria-label="Yıldızlar">⭐ 0</div>
  </header>
  <main id="main"></main>
  <nav class="bar" id="bar">
    <button data-v="map" aria-current="page"><span>🗺️</span>Ritimler</button>
    <button data-v="pad"><span>🥁</span>Davul çal</button>
    <button data-v="make"><span>✏️</span>Ritmini yap</button>
    <button data-v="echo"><span>🦜</span>Taklit et</button>
  </nav>
</div>
<div class="wm" id="wm"></div>

<div class="ov" id="gate" hidden>
  <div class="box">
    <div style="font-size:64px;line-height:1">🥁</div>
    <h2>Minik Davulcu</h2>
    <p>Adını yaz, ritim yolculuğuna başla!</p>
    <input id="gName" placeholder="Adın" maxlength="40" autocomplete="off" aria-label="Ad">
    <input id="gCode" placeholder="Açılış kodu (anne-baba için)" maxlength="20" autocapitalize="characters" spellcheck="false" autocomplete="off" aria-label="Açılış kodu">
    <div class="err" id="gErr"></div>
    <button class="b1" id="gGo">Başla</button>
    <p style="font-size:15px;color:var(--muted)">Kod yoksa ilk 2 ritim ücretsiz açılır.</p>
  </div>
</div>

<div class="ov" id="lock" hidden>
  <div class="box">
    <div style="font-size:60px;line-height:1">🔒</div>
    <h2>Bu ritim kilitli</h2>
    <p>Anne ya da babana göster: e-postayla gelen açılış kodunu yazsınlar.</p>
    <input id="lCode" placeholder="ALT-MK-XXXX-XXXX" maxlength="20" autocapitalize="characters" spellcheck="false" autocomplete="off" aria-label="Açılış kodu">
    <div class="err" id="lErr"></div>
    <button class="b1" id="lGo">Kilidi aç</button>
    <a class="b2" href="https://yunusaltaydrums.wordpress.com/dersler-ve-urunler/" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">Kod yok mu? Siteden al</a>
    <button class="b2" data-close>Kapat</button>
  </div>
</div>

<div class="ov" id="win" hidden>
  <div class="box">
    <div class="big-star" id="winStar">⭐</div>
    <h2 id="winT">Süpersin!</h2>
    <p id="winP"></p>
    <button class="b1" data-close>Devam</button>
  </div>
</div>

var SLOTS=[null,null,null];try{SLOTS=JSON.parse(store("md_slots")||"null")||SLOTS;}catch(e){}
function mkStore(){store("md_make",JSON.stringify(mk));}
function mkEmpty(){return MKR.every(function(k){return !mk[k].length;});}
function miniStaff(){var notes={};MKR.forEach(function(k){mk[k].forEach(function(s){(notes[s]=notes[s]||[]).push(k);});});
 var W=380,H=4*S+80,y0=40,o=['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+H+'"><rect width="'+W+'" height="'+H+'" fill="#fff"/>'];
 for(var l=0;l<5;l++)o.push('<line x1="6" y1="'+(y0+l*S)+'" x2="'+(W-6)+'" y2="'+(y0+l*S)+'" stroke="'+INK+'" stroke-width="0.8"/>');
 o.push('<rect x="13" y="'+(y0+S)+'" width="3.2" height="'+(2*S)+'" fill="'+INK+'"/><rect x="19" y="'+(y0+S)+'" width="3.2" height="'+(2*S)+'" fill="'+INK+'"/>');
 o.push('<text x="38" y="'+(y0+2*S-0.5)+'" font-size="'+(2.25*S)+'" font-weight="800" text-anchor="middle" font-family="Georgia,serif" fill="'+INK+'">4</text><text x="38" y="'+(y0+4*S-0.5)+'" font-size="'+(2.25*S)+'" font-weight="800" text-anchor="middle" font-family="Georgia,serif" fill="'+INK+'">4</text>');
 o.push(drawMeasure({notes:notes,acc:[]},"44_8",54,W-10,y0,-1));
 o.push('<rect x="'+(W-9.5)+'" y="'+y0+'" width="3.5" height="'+(4*S)+'" fill="'+INK+'"/><line x1="'+(W-12.5)+'" y1="'+y0+'" x2="'+(W-12.5)+'" y2="'+(y0+4*S)+'" stroke="'+INK+'" stroke-width="0.9"/></svg>');
 return o.join("");}
function mkCell(k,s){var on=mk[k].indexOf(s)>=0;return '<button class="c'+(on?' f '+k:'')+'" data-k="'+k+'" data-s="'+s+'" aria-label="'+MKL[k][0]+' '+COUNT[s]+'">'+(on?MKW[k]:'·')+'</button>';}
function drawMake(){var g='<div class="grid mk" id="grid"><div class="row cnt"><span></span>'+COUNT.map(function(c,s){return '<span class="c'+(s%2===0?' big':'')+'" data-s="'+s+'">'+c+'</span>';}).join("")+'</div>';
 MKR.forEach(function(k){g+='<div class="row"><span class="lab">'+MKL[k][0]+'<small>'+MKL[k][1]+'</small></span>';for(var s=0;s<8;s++)g+=mkCell(k,s);g+='</div>';});g+='</div>';
 $("main").innerHTML='<p class="ptitle">✏️ Kendi ritmini yap!</p><p class="pnote">Kutulara dokun, sonra ▶ ile dinle. Beğenmezsen değiştir!</p>'+g+
  '<div class="say" id="say">🥁</div>'+
  '<div class="ctrl"><button class="bigbtn slow" id="mSlow">🐢<small>Yavaş</small></button><button class="bigbtn play" id="mPl">▶</button><button class="bigbtn fast" id="mFast">🐇<small>Hızlı</small></button></div>'+
  '<div class="acts"><button id="mClr"><span>🧽</span>Sil</button><button id="mRnd"><span>🎲</span>Sürpriz</button><button id="mSav"><span>💾</span>Kaydet</button></div>'+
  '<p class="sec">📦 Ritim kutum</p><div class="slots" id="slots"></div>'+
  '<div class="realn"><b>🎼 Gerçek notası</b><small>Büyük davulcular ritmini böyle yazar!</small><div id="mStaff">'+miniStaff()+'</div></div>';
 drawSlots();
 $("mPl").onclick=function(){mkOn?mkStop():mkStart();};
 $("mSlow").onclick=function(){mkBpm=Math.max(50,mkBpm-6);say("🐢 "+mkBpm);};
 $("mFast").onclick=function(){mkBpm=Math.min(110,mkBpm+6);say("🐇 "+mkBpm);};
 $("mClr").onclick=function(){MKR.forEach(function(k){mk[k]=[];});mkStore();mkRedraw();say("🧽");};
 $("mRnd").onclick=function(){var r=function(p){return Math.random()<p;};MKR.forEach(function(k){mk[k]=[];});
  mk.bd=[0];mk.sd=[];var back=r(0.75);if(back)mk.sd=[2,6];else mk.sd=[4];
  [1,3,4,5,7].forEach(function(s){if(mk.sd.indexOf(s)<0&&r(0.22))mk.bd.push(s);});
  mk.hh=r(0.5)?[0,1,2,3,4,5,6,7]:[0,2,4,6];if(r(0.3)){mk.hh=mk.hh.filter(function(s){return s<6;});mk.t1=[6];mk.sd=mk.sd.filter(function(s){return s<6;}).concat(r(0.5)?[7]:[]);}
  if(r(0.4))mk.cr=[0];if(mk.cr.length)mk.hh=mk.hh.filter(function(s){return s!==0;});
  MKR.forEach(function(k){mk[k].sort(function(a,b){return a-b;});});mkStore();mkRedraw();say("🎲 Sürpriz!");if(!mkOn)mkStart();};
 $("mSav").onclick=function(){if(mkEmpty()){say("Önce kutulara dokun!");return;}mkSave=!mkSave;$("mSav").classList.toggle("on",mkSave);$("slots").classList.toggle("saving",mkSave);if(mkSave)say("Bir kutu seç 👇");};
 $("grid").addEventListener("click",function(e){var b=e.target.closest("button.c");if(!b)return;var k=b.getAttribute("data-k"),s=+b.getAttribute("data-s"),a=mk[k],i=a.indexOf(s);
  if(i>=0)a.splice(i,1);else{a.push(s);a.sort(function(x,y){return x-y;});unlockIOS();play1(k,now(),1);}
  mkStore();b.outerHTML=mkCell(k,s);$("mStaff").innerHTML=miniStaff();});
 $("slots").addEventListener("click",function(e){var b=e.target.closest(".slot");if(!b)return;var i=+b.getAttribute("data-i");
  if(mkSave){SLOTS[i]={e:MKE[Math.floor(Math.random()*MKE.length)],r:JSON.parse(JSON.stringify(mk))};store("md_slots",JSON.stringify(SLOTS));mkSave=false;$("mSav").classList.remove("on");drawSlots();say(SLOTS[i].e+" Kaydedildi!");confetti();return;}
  if(!SLOTS[i]){say("Bu kutu boş");return;}mk=JSON.parse(JSON.stringify(SLOTS[i].r));MKR.forEach(function(k){if(!mk[k])mk[k]=[];});mkStore();mkRedraw();say(SLOTS[i].e);});
 $("main").scrollTop=0;}
function drawSlots(){var el=$("slots");if(!el)return;el.classList.toggle("saving",mkSave);el.innerHTML=SLOTS.map(function(x,i){return x?'<button class="slot" data-i="'+i+'"><span>'+x.e+'</span>Ritim '+(i+1)+'</button>':'<button class="slot empty" data-i="'+i+'"><span>＋</span>boş</button>';}).join("");}
function mkRedraw(){var g=$("grid");if(!g)return;MKR.forEach(function(k){for(var s=0;s<8;s++){var b=g.querySelector('button.c[data-k="'+k+'"][data-s="'+s+'"]');if(b)b.outerHTML=mkCell(k,s);}});$("mStaff").innerHTML=miniStaff();}
function mkStart(){unlockIOS();var a=ctx();if(!a)return;if(a.state==="suspended")a.resume();mkOn=true;mkS=0;mkCi=4;mkT=a.currentTime+0.1;$("mPl").textContent="■";$("mPl").classList.add("on");mkTimer=setInterval(mkTick,25);}
function mkStop(){mkOn=false;clearInterval(mkTimer);if(mkLast)mkLast.forEach(function(c){c.classList.remove("col-on");});mkLast=null;var p=$("mPl");if(p){p.textContent="▶";p.classList.remove("on");}}
function mkTick(){var a=AC;if(!a)return;
 while(mkT<a.currentTime+0.12){var dt=60/mkBpm/2;
  if(mkCi>0){var n=5-mkCi;hit(n===1?"c1":"c0",mkT);(function(n,w){setTimeout(function(){if(mkOn)say(n===4?"Hazır!":String(n));},Math.max(0,(w-a.currentTime)*1000));})(n,mkT);mkT+=dt*2;mkCi--;continue;}
  var s=mkS%8,ins=MKR.filter(function(k){return mk[k].indexOf(s)>=0;});
  ins.forEach(function(k){play1(k,mkT,k==="hh"?0.8:1);});if(s%2===0)hit(s===0?"c1":"c0",mkT,0.5);
  (function(s,ins,w){setTimeout(function(){if(!mkOn)return;if(mkLast)mkLast.forEach(function(c){c.classList.remove("col-on");});mkLast=Array.prototype.slice.call(document.querySelectorAll('#grid [data-s="'+s+'"]'));mkLast.forEach(function(c){c.classList.add("col-on");});
   var w2=ins.filter(function(k){return k!=="hh";}).map(function(k){return MKW[k];});if(!w2.length&&ins.length)w2=["ts"];say(w2.length?w2.join(" "):"·");},Math.max(0,(w-a.currentTime)*1000));})(s,ins,mkT);
  mkT+=dt;mkS++;}}

/* ---------- taklit oyunu ---------- */
var eLen=3,eSeq=[],eIn=[],eBusy=false,eScore=+(store("md_echo")||0);
function drawEcho(){$("main").innerHTML='<div class="echo"><p class="pnote" style="font-size:21px">Ben çalacağım, sen aynısını çal! 🦜</p><div class="msg" id="eMsg">Puan: '+eScore+'</div><div class="seq" id="eSeq"></div>'+
 '<button class="go" id="eGo">▶ Dinle</button><div class="pads"><button class="pad" id="pB" style="background:var(--bum)">BUM</button><button class="pad" id="pT" style="background:var(--tak)">TAK</button></div></div>';
 $("eGo").onclick=eStart;$("pB").addEventListener("pointerdown",function(e){e.preventDefault();eTap("bd");});$("pT").addEventListener("pointerdown",function(e){e.preventDefault();eTap("sd");});}
function eDots(n,lit){var h="";for(var i=0;i<n;i++){var k=lit&&lit[i];h+='<span class="dot'+(k?' lit':'')+'" style="background:'+(k==="bd"?"var(--bum)":k==="sd"?"var(--tak)":"#f3e8ff")+'">'+(k?WORD[k]:"")+'</span>';}$("eSeq").innerHTML=h;}
function eStart(){if(eBusy)return;unlockIOS();var a=ctx();if(!a)return;eBusy=true;eIn=[];eSeq=[];for(var i=0;i<eLen;i++)eSeq.push(Math.random()<0.5?"bd":"sd");
 $("eMsg").textContent="Dinle… 👂";eDots(eLen);var t=now()+0.2,gap=0.6;
 eSeq.forEach(function(k,i){play1(k,t+i*gap,1);setTimeout(function(){eDots(eLen,eSeq.slice(0,i+1));},(0.2+i*gap)*1000);});
 setTimeout(function(){eDots(eLen);$("eMsg").textContent="Şimdi sen çal! 🥁";eBusy=false;},(0.2+eLen*gap)*1000);}
function eTap(k){unlockIOS();play1(k,now(),1);if(eBusy||!eSeq.length)return;eIn.push(k);eDots(eLen,eIn);var i=eIn.length-1;
 if(eIn[i]!==eSeq[i]){$("eMsg").textContent="Az kaldı! Tekrar dinle 🙂";eSeq=[];eLen=Math.max(3,eLen-1);return;}
 if(eIn.length===eSeq.length){eScore++;store("md_echo",eScore);$("eMsg").textContent="Aynısı! 🎉 Puan: "+eScore;confetti();eSeq=[];if(eScore%3===0&&eLen<8)eLen++;}}

/* ---------- sertifika, konfeti ---------- */
function showCert(){$("main").innerHTML='<div class="cert"><div style="font-size:70px;line-height:1">🏆</div><h2>Minik Davulcu Sertifikası</h2><p style="font-size:20px;font-weight:700">Bu sertifika</p><div class="nm">'+esc(ACT?ACT.name:"")+'</div><p style="font-size:20px;font-weight:700">8 ritmin hepsini çaldı ve '+totalStars()+' yıldız kazandı.</p><p style="margin-top:14px;font-size:18px;color:var(--muted)">Yunus Altay · ALTAY Davul</p></div>';$("back").hidden=false;$("title").textContent="Sertifika";confetti();}
function confetti(){var d=document.createElement("div");d.className="confetti";var cs=["#ef4444","#2563eb","#eab308","#a855f7","#22c55e"];for(var i=0;i<40;i++){var c=document.createElement("i");c.style.left=Math.random()*100+"%";c.style.background=cs[i%5];c.style.animationDelay=Math.random()*0.5+"s";d.appendChild(c);}document.body.appendChild(d);setTimeout(function(){d.remove();},2300);}

/* ---------- kapılar ---------- */
function openLock(){$("lErr").textContent="";$("lCode").value="";$("lock").hidden=false;}
$("lGo").onclick=function(){var c=$("lCode").value.trim().toUpperCase(),p=ACODE.pack(ACT.name,c);if(!p||["MK","TM"].indexOf(p)<0){$("lErr").textContent="Kod bu isimle eşleşmedi.";return;}ACT.code=c;saveAct();$("lock").hidden=true;drawMap();confetti();};
$("gGo").onclick=function(){var n=$("gName").value.trim().replace(/\s+/g," "),c=$("gCode").value.trim().toUpperCase();
 if(ACODE.norm(n).length<2){$("gErr").textContent="Adını yaz.";return;}
 if(c){var p=ACODE.pack(n,c);if(!p||["MK","TM"].indexOf(p)<0){$("gErr").textContent="Kod bu isimle eşleşmedi. Adı siparişteki gibi yaz.";return;}}
 ACT={name:n,code:c||""};saveAct();$("gate").hidden=true;unlockIOS();start();};
Array.prototype.forEach.call(document.querySelectorAll(".ov"),function(o){o.addEventListener("click",function(e){if(e.target===o&&o.id!=="gate"||e.target.closest("[data-close]"))o.hidden=true;});});
document.addEventListener("contextmenu",function(e){if(!e.target.closest("input"))e.preventDefault();});
document.addEventListener("visibilitychange",function(){if(document.hidden){stopPlay();mkStop();}});
function start(){$("wm").textContent="ALTAY · "+ACT.name;$("starCount").textContent="⭐ "+totalStars();nav("map");}
if(ACT&&ACT.name)start();else $("gate").hidden=false;
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});
})();
</script>
